# Strict CI for cirrocumulus. Every gate is blocking; `ci-ok` at the bottom
# is the single status check to mark "required" in branch protection.
#
# Run the same gates locally with scripts/ci/local.sh, and install the git
# hooks (commit-msg + pre-push) with scripts/ci/install-hooks.sh.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment);
# Dependabot (.github/dependabot.yml) keeps them current.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: new RustSec advisories land without any code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  changes:
    # Which gates this change needs (scripts/ci/changes.sh has the rules):
    # a docs- or shell-only push skips the Rust and supply-chain jobs, and a
    # Rust push only tests the crates it touched plus their dependents.
    # Scheduled and manual runs, and pushes with no usable "before" commit,
    # run everything.
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      supply_chain: ${{ steps.detect.outputs.supply_chain }}
      crates: ${{ steps.detect.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              # Three dots: diff against the merge base, so commits that
              # landed on main after this branch forked don't count.
              args=("$PR_BASE...$PR_HEAD") ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2> /dev/null; then
                args=("$PUSH_BEFORE..$GITHUB_SHA")
              else
                args=(--all) # new branch / force push: nothing reliable to diff against
              fi ;;
            *)
              args=(--all) ;;
          esac
          scripts/ci/changes.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  git:
    name: Git history & repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit messages & linear history
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2> /dev/null; then
                range="$PUSH_BEFORE..$GITHUB_SHA"
              else
                range="$GITHUB_SHA~1..$GITHUB_SHA" # new branch / force push: check the tip
              fi ;;
            *)
              echo "no new commits to check on $EVENT"; exit 0 ;;
          esac
          scripts/ci/check-commits.sh "$range"

      - name: PR title (becomes the commit subject on squash-merge)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          scripts/ci/check-commits.sh --file "$RUNNER_TEMP/pr-title"

      - name: Repo hygiene
        run: scripts/ci/check-hygiene.sh

  lint:
    name: Lint (shell, spelling, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: shellcheck@0.11.0,typos@1.50.3
      - name: Install actionlint
        # Straight from the release, pinned by version and SHA-256:
        # install-action's manifest can lag actionlint releases, and its
        # cargo-binstall fallback can't install a Go tool (issue #3).
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: shellcheck
        run: scripts/ci/check-shell.sh
      - name: CI script tests
        run: |
          scripts/ci/tests/check-commits.test.sh
          scripts/ci/tests/changes.test.sh
      - name: typos
        run: typos
      - name: actionlint
        run: actionlint

  rust:
    name: Rust (fmt, clippy, docs, tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: tests (changed crates and their dependents)
        env:
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          read -ra crates <<< "$CRATES"
          scripts/ci/test.sh "${crates[@]}"

  supply-chain:
    name: Supply chain (cargo-deny, unused deps)
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --locked check
      - name: cargo machete (unused dependencies)
        run: cargo machete

  image:
    # cirro-image builds ext4 from a tarball with `mke2fs -d`, which needs
    # e2fsprogs 1.47.1+. ubuntu-24.04 ships 1.47.0, where those tests skip,
    # so they run here on Debian trixie instead.
    name: Image builder (Debian trixie)
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.crates == 'all' || contains(needs.changes.outputs.crates, 'cirro-image'))
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    timeout-minutes: 20
    steps:
      - name: Install e2fsprogs and a C linker
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends \
            ca-certificates curl e2fsprogs gcc libc6-dev > /dev/null
          mke2fs -V
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - name: cirro-image tests
        run: cargo test --locked -p cirro-image

  every-commit-builds:
    # Keeps history bisectable: each commit in a PR must pass clippy on its
    # own, not just the tip. The `rust` job already covers the tip itself.
    name: Every commit builds
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy on each commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t commits < <(git rev-list --reverse "$PR_BASE..$PR_HEAD~1")
          echo "checking ${#commits[@]} commit(s) before the tip"
          for sha in "${commits[@]}"; do
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            git checkout --quiet "$sha"
            # Whatever toolchain this commit resolves to (its own
            # rust-toolchain.toml, or the runner's stable if it predates
            # one) needs clippy plus the musl target build.rs embeds
            # guest-init with (issue #2).
            if [ -f rust-toolchain.toml ]; then rustup toolchain install > /dev/null; fi
            rustup component add clippy > /dev/null
            rustup target add x86_64-unknown-linux-musl > /dev/null
            cargo clippy --workspace --all-targets --locked -- -D warnings
            echo "::endgroup::"
          done

  ci-ok:
    # The one check to require in branch protection. Fails if any gate
    # failed or was cancelled; `every-commit-builds` is skipped on pushes,
    # and gates `changes` found irrelevant are skipped too. If `changes`
    # itself fails, its dependents skip but its own failure still fails this.
    name: CI OK
    if: always()
    needs: [changes, git, lint, rust, image, supply-chain, every-commit-builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a required gate finished with '$r'"; exit 1 ;;
            esac
          done
