name: Bug report
description: Something in cirro doesn't work as documented
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, and their output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Node agent log
      description: "`journalctl -u cirro --since '10 min ago'`, if the agent was involved."
      render: text
  - type: input
    id: version
    attributes:
      label: cirro --version, and the host's distro and kernel (uname -r)
    validations:
      required: true
