# Spell-check config for `typos` (run in CI and scripts/ci/local.sh).
# Add real false positives here with a comment saying where they come from.

[files]
# Internal planning docs are gitignored; lockfiles are generated; the vendored
# Alpine signing keys are base64 that happens to contain "words".
extend-exclude = ["Cargo.lock", "BUILD_PATHWAY.md", "RESEARCH*.md", "*.rsa.pub"]

[default.extend-words]
# `carrer_quiz.db` is the upstream uvm-career-quiz app's own database
# filename (see scripts/apps/uvm-career-quiz/build_rootfs.sh).
carrer = "carrer"
