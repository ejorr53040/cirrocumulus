[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/ejorr53040/cirrocumulus"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
http-body-util = "0.1"
bytes = "1"
serde = "1"
serde_json = "1"
nix = "0.31.3"
rtnetlink = "0.23"
futures-util = "0.3"
