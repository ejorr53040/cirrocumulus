[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/ejorr53040/cirrocumulus"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "signal", "sync"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
http-body-util = "0.1"
bytes = "1"
serde = "1"
serde_json = "1"
nix = "0.31.3"
rtnetlink = "0.23"
rusqlite = { version = "0.40", features = ["bundled"] }
futures-util = "0.3"
tracing = "0.1"
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
ratatui = "0.30"
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
cirro-proto = { path = "crates/cirro-proto", version = "0.1.0" }
cirro-node = { path = "crates/cirro-node", version = "0.1.0" }
cirro-image = { path = "crates/cirro-image", version = "0.1.0" }
cirro-tui = { path = "crates/cirro-tui", version = "0.1.0" }
cirro-edge = { path = "crates/cirro-edge", version = "0.1.0" }

# Lints every crate opts into with `[lints] workspace = true`. CI runs
# clippy with `-D warnings`, so "warn" here still fails the build.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Every `unsafe` block needs a `// SAFETY:` comment saying why it's sound.
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
