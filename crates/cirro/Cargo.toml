[package]
name = "cirrocumulus"
description = "Cirrocumulus: a Firecracker mini cloud in Rust. Each workload runs in a jailed microVM, managed from the `cirro` CLI and terminal dashboard."
keywords = ["firecracker", "microvm", "self-hosted", "cloud", "tui"]
categories = ["command-line-utilities", "os::linux-apis", "network-programming"]
readme = "../../README.md"
homepage = "https://github.com/ejorr53040/cirrocumulus"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cirro"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
cirro-guest-init.workspace = true
cirro-image.workspace = true
cirro-node.workspace = true
cirro-proto.workspace = true
cirro-tui.workspace = true
ratatui.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyperlocal.workspace = true
nix = { workspace = true, features = ["socket"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
nix = { workspace = true, features = ["signal", "user"] }
predicates.workspace = true
rusqlite.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# Used by build.rs through its `links` metadata, not by any code.
ignored = ["cirro-guest-init"]
